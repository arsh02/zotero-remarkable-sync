<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-connection-title"></html:h2></label>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-code"
        data-l10n-id="pref-connection-code"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-code"
        maxlength="8"
        size="10"
      ></html:input>
      <button
        id="zotero-prefpane-__addonRef__-connect"
        data-l10n-id="pref-connection-connect"
      />
    </hbox>
    <html:label
      id="zotero-prefpane-__addonRef__-status"
      data-l10n-id="pref-connection-status-disconnected"
    ></html:label>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-sync-title"></html:h2></label>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-tag"
        data-l10n-id="pref-sync-tag"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-tag"
        preference="syncTag"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-folder"
        data-l10n-id="pref-sync-folder"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-folder"
        preference="folder"
      ></html:input>
    </hbox>
    <checkbox
      id="zotero-prefpane-__addonRef__-safe-mode"
      preference="safeMode"
      data-l10n-id="pref-sync-safe-mode"
    />
    <html:label
      class="pref-help-text"
      data-l10n-id="pref-sync-safe-mode-help"
    ></html:label>
    <checkbox
      id="zotero-prefpane-__addonRef__-delete-on-unsync"
      preference="deleteOnUnsync"
      data-l10n-id="pref-sync-delete-on-unsync"
    />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-schedule-title"></html:h2></label>
    <hbox align="center">
      <html:label data-l10n-id="pref-schedule-mode"></html:label>
      <menulist
        id="zotero-prefpane-__addonRef__-mode"
        preference="syncMode"
        native="true"
      >
        <menupopup>
          <menuitem value="manual" data-l10n-id="pref-schedule-mode-manual" />
          <menuitem
            value="interval"
            data-l10n-id="pref-schedule-mode-interval"
          />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-interval"
        data-l10n-id="pref-schedule-interval"
      ></html:label>
      <html:input
        type="number"
        min="1"
        id="zotero-prefpane-__addonRef__-interval"
        preference="syncInterval"
      ></html:input>
    </hbox>
  </groupbox>

  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
  </vbox>
</vbox>
